<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Posting Location | NSA WAWM</title><link rel="icon" href="./assets/my_logo.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#17372a;font:15px/1.55 Inter,"Segoe UI",Arial,sans-serif}.top{background:#006b3f;color:white;padding:22px 18px}.top-inner{max-width:900px;margin:auto}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;color:#e4f1e9}main{max-width:900px;margin:24px auto;padding:0 16px 40px}.card{background:#fff;border:1px solid #dce8e0;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #163e2a0b}label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input{width:100%;padding:12px;border:1px solid #d5e1d9;border-radius:8px;font:inherit}button{background:#006b3f;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:12px}button.secondary{background:#eaf3ed;color:#006b3f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:12px;background:#f7faf8;border-radius:9px;min-width:0}.item small{display:block;color:#687b70;font-size:12px}.item strong{display:block;overflow-wrap:anywhere}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{color:#006b3f;font-weight:650}.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.photo-grid img{width:100%;height:180px;object-fit:cover;border-radius:10px}.muted{color:#687b70}#notice{padding:10px;border-radius:8px;margin-bottom:12px;display:none}#notice.error{background:#fff0f0;color:#9b2222}#notice.ok{background:#e8f6ed;color:#17653a}@media(max-width:600px){.row,.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><div class="top-inner"><h1>My National Service Posting</h1><p>Verify your identity to view information about your official posting institution.</p></div></div>
<main><div id="notice"></div>
<section class="card" id="verifyCard"><h2>Verify your identity</h2><p class="muted">Enter your NSS number. A one-time verification code will be sent to the phone number or email recorded in your personnel record.</p><label for="nss">NSS number</label><input id="nss" autocomplete="off" placeholder="Enter your NSS number"><button onclick="sendCode()">Send verification code</button>
<div id="otpPanel" class="hidden" style="margin-top:18px"><label for="otp">Verification code</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button onclick="verifyCode()">Verify and view posting information</button></div></section>
<section class="card hidden" id="resultCard"><div id="result"></div><button class="secondary" onclick="resetPage()">Verify another NSS number</button></section>
</main>
<script src="./assets/config.js"></script><script src="./assets/apps-script-bridge.js"></script>
<script>
const $=id=>document.getElementById(id);let otpToken="",accessToken="";
function notice(msg,error){const n=$("notice");n.textContent=msg;n.className=error?"error":"ok";n.style.display="block"}
function esc(s){return String(s==null||s===""?"—":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function call(m,a){return window.NSA_API.invoke(m,a||[])}
async function sendCode(){try{const nss=$("nss").value.trim();if(!nss)throw new Error("Enter your NSS number.");const r=await call("sendAgencyInfoOTP",[nss]);if(r.status!=="SUCCESS")throw new Error(r.message||"Could not send verification code.");otpToken=r.token;$("otpPanel").classList.remove("hidden");notice(r.message,false)}catch(e){notice(e.message,true)}}
async function verifyCode(){try{const r=await call("confirmAgencyInfoOTP",[otpToken,$("otp").value.trim()]);if(r.status!=="SUCCESS")throw new Error(r.message||"Verification failed.");accessToken=r.accessToken;const data=await call("getAgencyInfoWithAccess",[accessToken]);render(data);$("verifyCard").classList.add("hidden");$("resultCard").classList.remove("hidden");notice("Identity verified.",false)}catch(e){notice(e.message,true)}}
function contact(label,value,type){if(!value)return `<div class="item"><small>${label}</small><strong>Not provided</strong></div>`;let href=type==="email"?"mailto:"+value:type==="wa"?"https://wa.me/"+String(value).replace(/[^0-9]/g,""):"tel:"+String(value).replace(/[^0-9+]/g,"");return `<div class="item"><small>${label}</small><strong><a href="${esc(href)}">${esc(value)}</a></strong></div>`}
function render(r){const a=r.agency;if(!a){$("result").innerHTML=`<h2>Posting institution information</h2><p>${esc(r.message||"Agency details are not yet available.")}</p>`;return}const h=a.head||{},s=r.supervisor||{};let imgs=String(a.images||"").split(/\r?\n/).map(x=>x.trim()).filter(x=>/^https?:\/\//i.test(x));$("result").innerHTML=`<h2>${esc(a.name)}</h2><p class="muted">${esc(a.region)} · ${esc(a.district)}</p><div class="grid">
<div class="item"><small>Company code</small><strong>${esc(a.companyCode)}</strong></div><div class="item"><small>Other personnel officially posted here</small><strong>${esc(a.postedCount)}</strong></div>
<div class="item"><small>Physical / postal address</small><strong>${esc(a.address)}</strong></div><div class="item"><small>GPS address</small><strong>${esc(a.gps)}</strong></div>
<div class="item"><small>Industry</small><strong>${esc(a.industry)}</strong></div><div class="item"><small>Working environment / motivation</small><strong>${esc(a.motivation)}</strong></div>
<div class="item"><small>Accommodation</small><strong>${esc(a.accommodation)}</strong></div><div class="item"><small>Feeding</small><strong>${esc(a.feeding)}</strong></div>
<div class="item"><small>Extra allowance</small><strong>${esc(a.extraAllowance)}</strong></div><div class="item"><small>Amenities</small><strong>${esc(a.amenities)}</strong></div>
<div class="item"><small>Other benefits / facilities</small><strong>${esc(a.otherBenefits)}</strong></div></div>
<h3 style="margin-top:22px">Agency head / contact person</h3><div class="grid">${contact("Name",h.name)}${contact("Designation",h.designation)}${contact("Phone",h.phone,"phone")}${contact("WhatsApp",h.whatsapp,"wa")}${contact("Email",h.email,"email")}</div>
<h3 style="margin-top:22px">Your assigned supervisor</h3><div class="grid">${contact("Name",s.Name)}${contact("Designation",s.Designation)}${contact("Phone",s.Phone,"phone")}${contact("WhatsApp",s.WhatsApp,"wa")}${contact("Email",s.Email,"email")}</div>
${imgs.length?'<h3 style="margin-top:22px">Institution photographs</h3><div class="photo-grid">'+imgs.map(u=>'<img src="'+esc(u)+'" alt="Institution photograph">').join("")+'</div>':""}
<p class="muted" style="margin-top:20px;font-size:12px">Posting details are based on the official master personnel record. Contact the Secretariat if the institution or location information appears incorrect.</p>`}
function resetPage(){otpToken="";accessToken="";$("nss").value="";$("otp").value="";$("otpPanel").classList.add("hidden");$("verifyCard").classList.remove("hidden");$("resultCard").classList.add("hidden");$("notice").style.display="none"}
</script></body></html>
