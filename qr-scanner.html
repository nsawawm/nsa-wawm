<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006b3f"><title>NSA WAWM | QR Scanner</title><script src="./assets/config.js"></script><style>body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#005b36;color:#fff;padding:20px;box-sizing:border-box}.card{max-width:520px;background:#fff;color:#173d2e;padding:28px;border-radius:18px}button{background:#ffdc00;border:0;border-radius:99px;padding:14px 20px;font-weight:800;cursor:pointer}</style></head><body><main class="card"><h1>Scan an official NSA QR code</h1><p>Open the camera scanner, allow camera access, and keep the full QR code inside the frame. The scanner will return the decoded content to the page that opened it.</p><button id="open">OPEN QR CAMERA →</button><p id="msg" role="status"></p><p><a href="./index.html">Return to Home</a></p></main><script>document.getElementById("open").onclick=function(){const url=(window.NSA_CONFIG.cameraUrl||"https://nsawawm.github.io/camera-test/").replace(/\/$/,"")+"/?mode=qr-scan";const w=window.open(url,"_blank");document.getElementById("msg").textContent=w?"Camera opened. Return here after scanning.":"The browser blocked the camera popup. Allow pop-ups and try again.";};</script></body></html>
