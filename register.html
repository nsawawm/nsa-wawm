<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006b3f"><title>NSA WAWM | Personnel Verification</title>
<script src="./assets/config.js"></script><script src="./assets/apps-script-bridge.js"></script>
<style>
:root{--green:#006b3f;--deep:#004d2c;--bright:#28c96b;--gold:#ffdc00;--ink:#153b2d;--muted:#62736b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,transparent 0 48%,rgba(40,201,107,.95) 48% 68%,transparent 68%),linear-gradient(135deg,#005b36,#007747 55%,#005a35)}
.card{width:min(460px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 55px #003b272b}.kicker{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{color:var(--ink);font-size:29px;line-height:1.15;margin:12px 0}p{color:var(--muted);line-height:1.55}label{display:block;margin:20px 0 8px;font-weight:750;color:var(--ink)}input{width:100%;padding:15px;border:1px solid #ccdcd3;border-radius:12px;font:inherit}button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:999px;background:var(--gold);color:#073e2b;font-weight:900;cursor:pointer}button:disabled{opacity:.6}.message{min-height:20px;font-size:13px}footer{text-align:center;color:#fff;font-size:11px;margin-top:18px}
</style></head>
<body><div><main class="card"><span class="kicker">National Service Authority</span><h1>Personnel verification</h1><p>Enter the NSS number shown on your official record. We will check the record and send a verification code to the registered contact details.</p><form id="form"><label for="nss">NSS Number</label><input id="nss" name="nss" autocomplete="off" required placeholder="Enter NSS Number"><button id="submit" type="submit">SEND VERIFICATION CODE →</button><p id="message" class="message" role="status"></p></form></main><footer>Wassa Amenfi West Municipal Secretariat · Secure personnel administration</footer></div>
<script>
const form=document.getElementById("form"), nssInput=document.getElementById("nss"), button=document.getElementById("submit"), message=document.getElementById("message");
const api=window.NSA_API;
function show(text,error){message.textContent=text;message.style.color=error?"#a42d2d":"#006b3f";}
form.addEventListener("submit",async function(event){event.preventDefault();const nss=nssInput.value.trim();if(!nss){show("Enter the NSS number.",true);return;}button.disabled=true;button.textContent="Checking record…";
try{const opened=await api.request("openRegistrationPortal",{nssNumber:nss});if(!opened||opened.status!=="SUCCESS"||!opened.token)throw new Error(opened&&opened.message?opened.message:"Unable to start registration.");sessionStorage.setItem("NSA_REG_TOKEN",opened.token);const sent=await api.request("sendRegistrationOTP",{token:opened.token});if(!sent||sent.status!=="SUCCESS")throw new Error(sent&&sent.message?sent.message:"Unable to send OTP.");const handoff=await api.request("createRegistrationHandoff",{registrationToken:opened.token});if(!handoff||handoff.status!=="SUCCESS"||!handoff.handoffCode)throw new Error(handoff&&handoff.message?handoff.message:"Unable to create the secure OTP handoff.");const target=new URL("./otp.html",location.href);target.searchParams.set("purpose","registration");target.hash=new URLSearchParams({handoff:handoff.handoffCode}).toString();location.assign(target.toString());}
catch(error){show(error&&error.message?error.message:"Registration could not be started.",true);button.disabled=false;button.textContent="SEND VERIFICATION CODE →";}});
</script></body></html>
